name: Build pinyin hotwords

on:
  schedule:
    # Monthly, on the 1st at 04:00 UTC
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the dictionaries repository
        uses: actions/checkout@v4

      - name: Check out the keyboard repository
        uses: actions/checkout@v4
        with:
          repository: yueziii/Unexpected-Keyboard
          path: keyboard

      - name: Clone the corpora
        run: keyboard/scripts/download_pinyin_data.sh

      # The full word list ships with the APK; the monthly job only
      # refreshes the hotwords overlay (a few KB).
      - name: Rebuild the hotwords file and update the manifest
        run: |
          python3 keyboard/scripts/make_pinyin_pack.py --out-dir . \
            --hotwords-only

      - name: Commit the new hotwords
        run: |
          git config user.name "pinyin-dict-bot"
          git config user.email "bot@noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Rebuild hotwords ($(date -u +%F))"
            git push
          fi
